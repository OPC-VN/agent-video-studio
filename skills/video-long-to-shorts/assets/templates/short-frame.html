<!doctype html>
<!--
  Khung short dọc 1080×1920 cho HyperFrames. Script dựng của short thay các chỗ {{...}}:
    {{COMP_ID}} {{DUR}} {{HOOK_HTML}} {{STAGE_HTML}} {{AVATAR_HTML}} {{SUBS_HTML}} {{END_HTML}}
    {{MUSIC_HTML}} {{TIMELINE_JS}}
  Màu và font lấy từ biến CSS: đổi theo chuẩn hình của kênh, không sửa luật bố cục.
  Không CSS animation, không vòng lặp vô hạn: mọi chuyển động nằm trên timeline T.
  GSAP dùng bản cục bộ của trạm (video-studio libs fetch gsap), không CDN.
-->
<html lang="vi"><head><meta charset="utf-8"><title>short</title>
<script src="assets/gsap.min.js"></script>
<style>
@font-face{font-family:Studio;src:url('assets/regular.ttf');font-weight:400}
@font-face{font-family:Studio;src:url('assets/bold.ttf');font-weight:700}
:root{
  --bg:#060b1c; --bg-glow:#11295c; --panel:#0c1a3a;
  --accent:#22c7f2; --warm:#f7a531; --text:#f4f7fb; --link:#ffe08a;
  --sub-top:1590px; --sub-h:140px; --sub-size:64px;
  --avatar-d:400px; --avatar-x:50px; --avatar-y:1100px;
}
*{box-sizing:border-box}
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#000;font-family:Studio,sans-serif;color:var(--text)}
#root{position:relative;width:1080px;height:1920px;overflow:hidden;background:var(--bg)}
.bg{position:absolute;inset:0;background:radial-gradient(ellipse 90% 50% at 50% 32%,var(--bg-glow) 0,var(--bg) 78%)}
.orb{position:absolute;border-radius:50%;filter:blur(70px);opacity:.3}
#orb1{left:-160px;top:420px;width:560px;height:560px;background:var(--accent)}
#orb2{left:640px;top:1000px;width:520px;height:520px;background:var(--warm);opacity:.16}

/* V0 hook: câu hỏi 0–2 s */
#hook{position:absolute;left:60px;right:120px;top:760px;text-align:center;font-weight:700;font-size:120px;line-height:1.04;opacity:0;z-index:20}
#hook em{font-style:normal;color:var(--warm)}

/* vùng hoạt họa: không avatar y 200–1500 · có avatar y 200–1080 (x 60–960) */
#stage{position:absolute;left:0;top:0;width:1080px;height:1920px;z-index:5}

/* icon động: .ia > .gl quầng · .ring vòng toả · .bob trôi > .in nhịp > img + .sh vệt sáng + lớp phủ theo % */
.ia{position:absolute;opacity:0}
.ia .gl{position:absolute;left:18%;top:18%;width:64%;height:64%;border-radius:50%}
.ia .bob,.ia .in{position:absolute;left:0;top:0;width:100%;height:100%}
.ia img{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:contain}
.ia .sh{position:absolute;left:0;top:0;width:100%;height:100%;-webkit-mask-size:100% 100%;mask-size:100% 100%;overflow:hidden}
.ia .sh i{position:absolute;top:-20%;left:-50%;width:30%;height:140%;background:linear-gradient(100deg,transparent,#ffffffaa,transparent);transform:skewX(-18deg)}
.ia .ring{position:absolute;left:10%;top:10%;width:80%;height:80%;border-radius:50%;border:4px solid var(--accent);opacity:0}
.ia .cell{position:absolute;border-radius:6%;background:var(--warm);opacity:0}      /* ô sáng: cửa sổ, ô lịch */
.ia .bar{position:absolute;border-radius:4px;background:var(--accent);transform-origin:50% 100%;transform:scaleY(0)}  /* cột mọc */
.ia .ln{position:absolute;height:4.5%;border-radius:4px;background:var(--accent);transform-origin:0 50%;transform:scaleX(0)}  /* dòng chữ giả */
.ia .rn{position:absolute;left:0;top:0;width:7%;height:7%;margin:-3.5% 0 0 -3.5%;border-radius:50%;background:var(--link);box-shadow:0 0 18px 8px var(--link);opacity:0}  /* đốm chạy */
.slot{position:absolute;border-radius:50%;border:3px dashed var(--accent);opacity:0}  /* ô chờ nét đứt */
.dl{position:absolute;left:0;top:0;opacity:0;z-index:4}                                /* đường chấm chạy */
.dl path{fill:none;stroke:var(--link);stroke-width:9;stroke-linecap:round;stroke-dasharray:1 20}
.media{position:absolute;left:60px;width:900px;border-radius:36px;overflow:hidden;box-shadow:0 0 0 3px var(--accent),0 24px 80px #000b;opacity:0}  /* V8 */
.media video,.media img{display:block;width:100%;height:100%;object-fit:cover}

/* avatar tròn nhỏ: mặc định góc dưới trái; bố cục đối xứng thì đổi --avatar-x về giữa */
#host{position:absolute;left:var(--avatar-x);top:var(--avatar-y);width:var(--avatar-d);height:var(--avatar-d);border-radius:50%;overflow:hidden;z-index:10;opacity:0;background:var(--panel);box-shadow:0 0 0 4px var(--accent),0 0 50px #0008}
#host video{position:absolute;left:-10%;top:0;width:120%;height:120%;object-fit:cover;object-position:50% 0}

/* phụ đề: x 60–960 (chừa cột nút 120 px), sát đáy */
#subs{position:absolute;left:60px;top:var(--sub-top);width:900px;height:var(--sub-h);z-index:40}
.sc{position:absolute;left:0;top:0;width:900px;opacity:0;text-align:center}
.sp{display:inline-block;padding:14px 30px 18px;border-radius:30px;background:#050b1fd9;font-weight:700;font-size:var(--sub-size);line-height:1.12;white-space:nowrap}
.sw{color:var(--text)}

/* V9 thẻ kết */
#end{position:absolute;inset:0;z-index:30;opacity:0}
#end .t1{position:absolute;left:60px;right:120px;top:920px;text-align:center;font-weight:700;font-size:84px;line-height:1.08}
#end .t1 em{font-style:normal;color:var(--warm)}
</style></head><body>
<div id="root" data-composition-id="{{COMP_ID}}" data-width="1080" data-height="1920" data-fps="30" data-duration="{{DUR}}">
<div class="bg"></div><div id="orb1" class="orb"></div><div id="orb2" class="orb"></div>

<!-- âm: giọng đã cắt sẵn; nhạc nền là MỘT clip để đổi chỉ sửa một dòng -->
<audio id="voice" class="clip" src="voice.wav" data-start="0" data-duration="{{DUR}}" data-volume="1" data-track-index="1"></audio>
{{MUSIC_HTML}}

<div id="hook">{{HOOK_HTML}}</div>
<div id="stage">
{{STAGE_HTML}}
</div>

<!-- avatar: mỗi đoạn một <video>, cắt giữa take bằng data-media-start lấy từ beats.json -->
<div id="host">
{{AVATAR_HTML}}
</div>

<div id="end">{{END_HTML}}</div>
<div id="subs">
{{SUBS_HTML}}
</div>
</div>
<script>
window.__timelines = window.__timelines || {};
const T = gsap.timeline({paused:true});
const Q = (sel) => Array.from(document.querySelectorAll(sel));
// số lần lặp luôn hữu hạn, tính từ thời gian phần tử có mặt
const times = (t0, t1, per) => Math.max(1, Math.floor((t1 - t0) / per));
const pop = (sel, t, d) => T.fromTo(sel, {opacity:0, scale:.62, y:26, transformOrigin:'50% 50%'}, {opacity:1, scale:1, y:0, duration:d||.45, ease:'back.out(1.7)', immediateRender:false}, t);
const out = (sel, t, d) => T.to(sel, {opacity:0, scale:.9, duration:d||.28, ease:'power2.in'}, t);
const loopy = (sel, t0, t1, vars, per) => T.to(sel, Object.assign({duration:per/2, yoyo:true, repeat:2*times(t0, t1, per)-1, ease:'sine.inOut'}, vars), t0);
const glint = (sel, t0, t1) => T.fromTo(sel, {xPercent:0}, {xPercent:600, duration:1.1, ease:'power1.inOut', repeat:times(t0, t1, 3.2)-1, repeatDelay:2.1, immediateRender:false}, t0);
const ringfx = (sel, t0, t1, per) => T.fromTo(sel, {scale:.55, opacity:.7}, {scale:1.55, opacity:0, duration:per, ease:'power1.out', repeat:times(t0, t1, per)-1, immediateRender:false}, t0);
const dots = (sel, t0, t1, dir) => { T.fromTo(sel, {opacity:0}, {opacity:1, duration:.3, immediateRender:false}, t0); T.fromTo(sel + ' path', {strokeDashoffset:0}, {strokeDashoffset:(dir||-1)*210, duration:1.6, ease:'none', repeat:times(t0, t1, 1.6)-1, immediateRender:false}, t0); out(sel, t1); };

{{TIMELINE_JS}}

window.__timelines["{{COMP_ID}}"] = T;
</script>
</body></html>
