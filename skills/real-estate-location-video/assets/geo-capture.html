<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<style>html,body,#m{margin:0;width:1080px;height:1920px;overflow:hidden}.maplibregl-ctrl-bottom-right,.maplibregl-ctrl-bottom-left{display:none}</style>
</head><body><div id="m"></div>
<script>
const q = new URLSearchParams(location.search);
const lat = +q.get("lat"), lon = +q.get("lon"), z = +q.get("z"), pitch = +q.get("pitch") || 0, bearing = +q.get("b") || 0;
const mode = q.get("mode"); // esri | osm | esri3d | osm3d
const raster = (tiles, size) => ({ type: "raster", tiles, tileSize: size || 256, maxzoom: 19 });
const sources = {
  esri: raster(["https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}"]),
  osm: raster(["https://tile.openstreetmap.org/{z}/{x}/{y}.png"]),
  omt: { type: "vector", url: "https://tiles.openfreemap.org/planet" }
};
const layers = [];
const base = mode.startsWith("esri") ? "esri" : "osm";
layers.push({ id: "base", type: "raster", source: base });
if (mode.endsWith("3d")) {
  layers.push({ id: "b3d", type: "fill-extrusion", source: "omt", "source-layer": "building", minzoom: 14,
    paint: { "fill-extrusion-color": mode.startsWith("esri") ? "#e9e4d8" : "#d8d2c4",
             "fill-extrusion-height": ["coalesce", ["get", "render_height"], 12],
             "fill-extrusion-base": ["coalesce", ["get", "render_min_height"], 0],
             "fill-extrusion-opacity": mode.startsWith("esri") ? 0.85 : 1 } });
}
const map = new maplibregl.Map({ container: "m", style: { version: 8, sources, layers }, center: [lon, lat], zoom: z - 1, pitch, bearing,
  interactive: false, attributionControl: false, fadeDuration: 0, canvasContextAttributes: { preserveDrawingBuffer: true } });
window.__ready = false;
map.on("idle", () => { window.__ready = true; document.title = "READY"; });
map.on("error", e => { window.__err = (window.__err || []).concat(String(e.error && e.error.message || e)); });
</script></body></html>
