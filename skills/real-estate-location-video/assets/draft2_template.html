<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <title>swan-lake-onsen draft 2</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "PB"; src: url("assets/Montserrat-900.ttf"); font-weight: 900; }
      @font-face { font-family: "PB"; src: url("assets/Montserrat-800.ttf"); font-weight: 800; }
      html, body { margin: 0; padding: 0; width: 1080px; height: 1920px; overflow: hidden; background: #000; }
      #master-root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #000; }
      .m { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; object-fit: cover; transform-origin: 50% 50%; }
      .g, .layer { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; transform-origin: 50% 50%; }
      .g .m { transform-origin: 50% 50%; }
      .ov { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: visible; }
      .lab { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
      .txt { position: absolute; font-family: "PB", sans-serif; font-weight: 900; color: #fff; line-height: 1.12; text-transform: none;
             -webkit-text-stroke: 9px #000; paint-order: stroke fill; }
      .txt.plain { font-weight: 800; -webkit-text-stroke: 0; text-shadow: 0 2px 6px #000, 0 0 14px #000; }
      .txt .ch { display: inline-block; white-space: pre; }
      .tag { position: absolute; font-family: "PB", sans-serif; font-weight: 900; color: #fff; white-space: nowrap; line-height: 1.1;
             -webkit-text-stroke: 8px #000; paint-order: stroke fill; }
      .tag .l1 { font-size: 44px; } .tag .l2 { font-size: 34px; font-weight: 800; color: #ffd34d; }
      .card { position: absolute; left: 60px; width: 960px; height: 270px; box-sizing: border-box; padding: 22px 34px;
              background: rgba(8, 18, 32, .74); border: 3px solid #27e6ff; border-radius: 24px; font-family: "PB", sans-serif; color: #fff; }
      .card .num { font-size: 118px; font-weight: 900; color: #b6ff1a; line-height: 1; display: inline-block; }
      .card .unit { font-size: 54px; font-weight: 800; margin-left: 16px; display: inline-block; }
      .card .cap { font-size: 38px; font-weight: 800; margin-top: 6px; }
      .card .src { font-size: 28px; font-weight: 800; color: #9fb3c8; margin-top: 4px; }
    </style>
  </head>
  <body>
    <svg width="0" height="0" style="position:absolute"><defs><filter id="gl" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="9"/></filter></defs></svg>
    <div id="master-root" data-composition-id="master" data-width="1080" data-height="1920" data-start="0" data-duration="__TOTAL__">
      __ELEMENTS__
      <script>
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });
        const NS = "http://www.w3.org/2000/svg";
        __BASEJS__
        const FX = __FX__;
        let uid = 0;
        const el = (tag, attrs, parent, ns) => { const e = ns ? document.createElementNS(NS, tag) : document.createElement(tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };
        const fmt = (v, dec) => { const s = v.toFixed(dec); const [i, d] = s.split("."); const ip = i.replace(/\B(?=(\d{3})+(?!\d))/g, "."); return d ? ip + "," + d : ip; };
        function spans(parent, text, cls, hl) {
          let h = false; const out = [];
          for (const ch of text) { if (ch === "[") { h = true; continue; } if (ch === "]") { h = false; continue; }
            const s = el("span", { class: "ch" }, parent); s.textContent = ch; if (h && hl) s.style.color = "#ffa21a"; out.push(s); }
          return out;
        }
        for (const e of FX) {
          const host = document.getElementById(e.host); const svg = host.querySelector("svg.ov"); const lab = host.querySelector(".lab");
          const at = e.T + e.at; const id = ++uid;
          if (e.t === "path") {
            const g = el("path", { d: e.d, fill: "none", stroke: e.c, "stroke-width": e.w + 10, "stroke-linecap": "round", "stroke-linejoin": "round", pathLength: 1, "stroke-dasharray": 1, "stroke-dashoffset": 1, filter: "url(#gl)", opacity: 0.9 }, svg, 1);
            const p = el("path", { d: e.d, fill: "none", stroke: e.c, "stroke-width": e.w, "stroke-linecap": "round", "stroke-linejoin": "round", pathLength: 1, "stroke-dasharray": 1, "stroke-dashoffset": 1 }, svg, 1);
            tl.to([g, p], { strokeDashoffset: 0, duration: e.dur, ease: "power2.inOut" }, at);
          } else if (e.t === "pin") {
            const grp = el("g", {}, svg, 1);
            const ring = el("circle", { cx: e.x, cy: e.y, r: 38, fill: "none", stroke: "#fff", "stroke-width": 5, opacity: 0 }, grp, 1);
            const dot = el("circle", { cx: e.x, cy: e.y, r: 22, fill: "#e11d2e", stroke: "#fff", "stroke-width": 6, opacity: 0 }, grp, 1);
            tl.fromTo(dot, { opacity: 0, scale: 0, transformOrigin: e.x + "px " + e.y + "px" }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(2.4)" }, at);
            tl.fromTo(ring, { opacity: 1, scale: 0.4, transformOrigin: e.x + "px " + e.y + "px" }, { opacity: 0, scale: 2.2, duration: 0.9, repeat: 2, ease: "power1.out" }, at + 0.2);
          } else if (e.t === "dash") {
            const m = el("mask", { id: "mk" + id, maskUnits: "userSpaceOnUse", x: 0, y: 0, width: 1080, height: 1920 }, svg, 1);
            const ml = el("line", { x1: e.x1, y1: e.y1, x2: e.x2, y2: e.y2, stroke: "#fff", "stroke-width": 30, pathLength: 1, "stroke-dasharray": 1, "stroke-dashoffset": e.dur ? 1 : 0 }, m, 1);
            el("line", { x1: e.x1, y1: e.y1, x2: e.x2, y2: e.y2, stroke: "#fff", "stroke-width": 8, "stroke-dasharray": "22 16", mask: "url(#mk" + id + ")" }, svg, 1);
            const end = el("circle", { cx: e.x2, cy: e.y2, r: 15, fill: "#ffd34d", stroke: "#000", "stroke-width": 4, opacity: e.dur ? 0 : 1 }, svg, 1);
            if (e.dur) { tl.to(ml, { strokeDashoffset: 0, duration: e.dur, ease: "power2.inOut" }, at); tl.to(end, { opacity: 1, duration: 0.2 }, at + e.dur); }
          } else if (e.t === "tag") {
            const box = el("div", { class: "tag" }, lab);
            el("div", { class: "l1" }, box).textContent = e.l1; if (e.l2) el("div", { class: "l2" }, box).textContent = e.l2;
            box.style.color = e.color || "#fff";
            const top = e.fixed_y !== undefined ? e.fixed_y : (e.auto ? Math.max(300, e.y - 40) : e.ty);
            box.style.top = top + "px";
            if (e.side === "l") { box.style.right = Math.max(30, 1080 - (e.x - 34)) + "px"; box.style.textAlign = "right"; }
            else { const wEst = Math.max(e.l1.length * 27, (e.l2 || "").length * 21) + 30; box.style.left = Math.min(Math.max(30, e.x + 34), 1050 - wEst) + "px"; }
            if (!e.auto) { box.style.left = e.tx + "px"; box.style.right = "auto"; box.style.textAlign = "left"; }
            tl.fromTo(box, { opacity: 0, y: 22 }, { opacity: 1, y: 0, duration: 0.4, ease: "back.out(1.7)" }, at);
          } else if (e.t === "chip") {
            const box = el("div", { class: "tag", style: "left:" + e.x + "px;top:" + e.y + "px" }, lab);
            el("div", { class: "l1" }, box).textContent = e.l1; if (e.l2) el("div", { class: "l2" }, box).textContent = e.l2;
            tl.fromTo(box, { opacity: 0, x: -40 }, { opacity: 1, x: 0, duration: 0.45, ease: "power3.out" }, at);
          } else if (e.t === "text" || e.t === "type") {
            const d = el("div", { class: "txt" + (e.plain ? " plain" : ""), style: "left:" + e.x + "px;top:" + e.y + "px;width:" + e.w + "px;font-size:" + e.size + "px;color:" + (e.color || "#fff") + (e.right ? ";text-align:right" : "") }, lab);
            if (e.t === "type") { const sp = spans(d, e.text, "", e.hl); tl.fromTo(sp, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.05, stagger: e.per || 0.04, ease: "power1.out" }, at); }
            else { d.textContent = e.text; tl.fromTo(d, { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.4, ease: "back.out(1.6)" }, at); }
            if (e.out) tl.to(d, { opacity: 0, duration: 0.25 }, at + e.out);
          } else if (e.t === "card") {
            const c = el("div", { class: "card", style: "top:" + e.y + "px" }, lab);
            const n = el("span", { class: "num" }, c); el("span", { class: "unit" }, c).textContent = e.unit;
            el("div", { class: "cap" }, c).textContent = e.cap; el("div", { class: "src" }, c).textContent = "Nguồn: " + e.src;
            const pre = /^\+/.test(e.num) ? "+" : "", suf = /%$/.test(e.num) ? "%" : "";
            const core = e.num.replace(/[+%]/g, ""); let dec = 0, val;
            if (core.includes(",")) { dec = core.split(",")[1].length; val = parseFloat(core.replace(/\./g, "").replace(",", ".")); } else { val = parseFloat(core.replace(/\./g, "")); }
            const o = { v: 0 }; n.textContent = pre + fmt(0, dec) + suf;
            tl.fromTo(c, { opacity: 0, x: -60 }, { opacity: 1, x: 0, duration: 0.45, ease: "power3.out" }, at);
            tl.to(o, { v: val, duration: 1.0, ease: "power2.out", onUpdate: () => { n.textContent = pre + fmt(o.v, dec) + suf; } }, at + 0.2);
          }
        }
        window.__timelines["master"] = tl;
      </script>
    </div>
  </body>
</html>
